    - data:
        selected: false
        template: "表结构设计 ：\r\n- comments ：存储评论ID、查询内容和情绪分类\r\n- keywords ：存储唯一关键字及自增ID（确保关键字不重复）\r\
          \n- comment_keywords ：多对多关联表，连接评论和关键字\r\n   \r\n三个表的基本信息\r\n1. comments表（评论表）\r\
          \n字段名\r\n数据类型\r\n说明\r\n约束\r\ncomment_id\r\nINT\r\n评论ID（主键）\r\nPRIMARY KEY\r\
          \nquery\r\nTEXT\r\n评论内容\r\nNOT NULL\r\nsentiment\r\nVARCHAR(20)\r\n情绪分类（积极/消极/中性）\r\
          \nNOT NULL\r\n\r\n2. keywords表（关键字表）\r\n字段名\r\n数据类型\r\n说明\r\n约束\r\nkeyword_id\r\
          \nINT\r\n关键字ID（主键）\r\nPRIMARY KEY\r\nkeyword\r\nVARCHAR(255)\r\n关键字内容\r\n\
          NOT NULL, UNIQUE\r\n\r\n3. comment_keywords表（评论-关键字关联表）\r\n字段名\r\n数据类型\r\
          \n说明\r\n约束\r\ncomment_id\r\nINT\r\n评论ID（外键）\r\nFOREIGN KEY\r\nkeyword_id\r\
          \nINT\r\n关键字ID（外键）\r\nFOREIGN KEY\r\n\r\n复合主键\r\nPRIMARY KEY (comment_id,\
          \ keyword_id)\r\n\r\n表关联关系\r\n- 一对多关系：一个评论可以对应多个关键字（通过comment_keywords表）\r\
          \n- 一对多关系：一个关键字可以属于多个评论（通过comment_keywords表）\r\n- 多对多关系：comments表和keywords表通过comment_keywords表建立多对多关联\r\
          \n  \r\n基本查询SQL案例\r\n\r\n1. 查询所有积极情绪的评论及其关键字\r\nSELECT \r\n  c.comment_id,\
          \ \r\n  c.query AS comment_content, \r\n  GROUP_CONCAT(k.keyword SEPARATOR\
          \ ', ') AS keywords\r\nFROM \r\n  comments c\r\nJOIN \r\n  comment_keywords\
          \ ck ON c.comment_id = ck.comment_id\r\nJOIN \r\n  keywords k ON ck.keyword_id\
          \ = k.keyword_id\r\nWHERE \r\n  c.sentiment = '积极'\r\nGROUP BY \r\n  c.comment_id,\
          \ c.query;\r\n\r\n2. 统计各情绪类型的评论数量\r\nSELECT \r\n  sentiment, \r\n  COUNT(*)\
          \ AS comment_count\r\nFROM \r\n  comments\r\nGROUP BY \r\n  sentiment;\r\
          \n\r\n3. 查询出现频率最高的前10个关键字\r\nSELECT \r\n  k.keyword, \r\n  COUNT(ck.keyword_id)\
          \ AS occurrence_count\r\nFROM \r\n  keywords k\r\nJOIN \r\n  comment_keywords\
          \ ck ON k.keyword_id = ck.keyword_id\r\nGROUP BY \r\n  k.keyword\r\nORDER\
          \ BY \r\n  occurrence_count DESC\r\nLIMIT 10;\r\n\r\n4. 查询包含特定关键字的所有评论\r\
          \nSELECT \r\n  c.comment_id, \r\n  c.query AS comment_content, \r\n  c.sentiment\r\
          \nFROM \r\n  comments c\r\nJOIN \r\n  comment_keywords ck ON c.comment_id\
          \ = ck.comment_id\r\nJOIN \r\n  keywords k ON ck.keyword_id = k.keyword_id\r\
          \nWHERE \r\n  k.keyword = '环保';"
